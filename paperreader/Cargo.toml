[package]
name = "paperreader"
version = "0.1.0"
edition = "2021"
description = "Bilingual computer-science paper reader for .paper PDF packages"

[dependencies]
anyhow = "1"
eframe = "0.29"
image = "0.25"
pdfium-render = "0.9.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
walkdir = "2"
zip = "2"
